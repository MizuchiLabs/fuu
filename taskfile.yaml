version: "3"

tasks:
  doctor:
    desc: Show TPM device key
    cmds:
      - go run . doctor

  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  coverage:
    desc: Run coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  build:
    desc: Build binary
    cmds:
      - go build -ldflags="-s -w" -trimpath -o fuu

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
