version: "3"

tasks:
  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...

  lint:
    desc: Run go vet & lint
    cmds:
      - go mod tidy
      - go fmt ./...
      - go vet ./...
      - govulncheck ./...
      - go test -race -count=1 -cover ./...
      - golangci-lint run --fix

  coverage:
    desc: Run coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  fuzz:
    desc: Fuzz the untrusted parsers, {{.FUZZTIME | default "30s"}} each
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - |
        for pkg in $(go list ./...); do
          for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz'); do
            go test "$pkg" -run='^$' -fuzz="^${target}$" -fuzztime="{{.FUZZTIME}}"
          done
        done

  build:
    desc: Build binary
    cmds:
      - mkdir -p ~/.local/bin
      - CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o ~/.local/bin/

  snapshot:
    desc: Build snapshot
    cmds:
      - goreleaser --snapshot --clean --skip=validate,sign,sbom,archive
